---
layout: default
---
<article class="container page project-page">
  <header class="page-header">
    <div class="project-hero-emoji" style="background: {{ page.color | default: 'var(--sage)' }};" aria-hidden="true">{{ page.emoji | default: '✨' }}</div>
    <p class="eyebrow">{{ page.status | default: 'Project' }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.blurb %}<p class="page-subtitle">{{ page.blurb }}</p>{% endif %}
    <div class="squiggle" aria-hidden="true"></div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/projects/' | relative_url }}">← All projects</a></p>
</article>
