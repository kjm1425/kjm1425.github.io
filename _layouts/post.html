---
layout: default
---
<article class="container page">
  <header class="page-header">
    <p class="eyebrow">From the archive · {{ page.date | date: '%B %-d, %Y' }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    <div class="squiggle" aria-hidden="true"></div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/writing/' | relative_url }}">← Back to the writing archive</a></p>
</article>
