<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>
    {% include meta.html %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml" />
  </head>
  <body>
    <header class="site-header">
      <div class="container container--wide">
        <a href="{{ site.baseurl }}/" class="site-brand">
          <img class="site-avatar" src="{{ site.avatar }}" alt="" />
          <div class="site-info">
            <span class="site-name">{{ site.name }}</span>
            <span class="site-description">{{ site.description }}</span>
          </div>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/about">About</a>
          <a href="{{ site.baseurl }}/resume">Resume</a>
          <a href="{{ site.baseurl }}/disc-golf-dyes">Disc Golf Dyes</a>
        </nav>
      </div>
    </header>
    <main id="main" role="main" class="main">
      <div class="container container--wide">
        {{ content }}
      </div>
    </main>
    <footer class="site-footer">
      <div class="container container--wide">
        <div class="footer-icons">
          {% include svg-icons.html %}
        </div>
      </div>
    </footer>
    {% include analytics.html %}
  </body>
</html>
