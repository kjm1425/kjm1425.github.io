# Site settings
name: Kylie Moden
description: Product manager, flautist & collector of ideas — Seattle, WA
avatar: /images/logo.gif
url: https://kyliemoden.com
baseurl: ""

# Contact / social
email: kyliemoden@gmail.com
linkedin: KylieModen

permalink: /:title/

# Projects live in _projects/ — add a markdown file there and it becomes a page
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: :expanded

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
